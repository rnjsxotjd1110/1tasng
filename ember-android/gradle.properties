org.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# 출시 설정(비워 두면 해당 기능이 숨겨진다). docs/RELEASE.md 참고.
# ember.serverUrl=https://ember-server.<계정>.workers.dev
# ember.reportEmail=support@example.com
# ember.privacyUrl=https://<사용자>.github.io/<저장소>/privacy.html
# ember.creditMarkup=1.5
# ember.freeCredits=40

# ---------------------------------------------------------------- 사업자·법적 고지 (출시 전에 꼭 채우기)
# 비어 있으면 앱의 약관·방침·정보 화면에 [미입력]으로 보이고, Play 업로드용 번들(bundleRelease)은 만들어지지 않아요.
# 저장소에 올라가므로 공개해도 되는 사업자 정보만 적어요.
# ember.biz.name=상호
# ember.biz.ceo=대표자
# ember.biz.regNo=000-00-00000
# ember.biz.salesNo=제0000-서울00-0000호
# ember.biz.address=사업장 주소
# ember.biz.phone=02-000-0000
# ember.biz.email=support@example.com
# ember.biz.privacyOfficer=성명(직책)
# ember.biz.dbRegion=Cloudflare D1 위치(예: 아시아태평양)
# ember.termsUrl=https://<사용자>.github.io/<저장소>/terms.html
# ember.deleteUrl=https://<사용자>.github.io/<저장소>/delete-account.html
# ember.legalEffective=2026-11-20
# ember.googleWebClientId=000000000000-xxxx.apps.googleusercontent.com
